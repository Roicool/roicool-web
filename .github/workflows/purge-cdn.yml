name: Purge CDN

# head.html @main'e baktığı sürece jsDelivr dalı 12 saate kadar cache'ler.
# dist/ değişen her main push'unda cache'i temizle ki push anında yayında olsun.
# Elle de tetiklenebilir (Actions › Purge CDN › Run workflow).

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run purge
