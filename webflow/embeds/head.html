<script>
  (function () {
    function disableInteractions(body) {
      body.setAttribute("data-wf-ix-vacation", "1");
    }
    if (document.body) {
      disableInteractions(document.body);
      return;
    }
    new MutationObserver(function (mutations, observer) {
      if (!document.body) return;
      disableInteractions(document.body);
      observer.disconnect();
    }).observe(document.documentElement, { childList: true });
  })();
</script>
<script>
  document.documentElement.classList.add("rc-js");
</script>
